name: Rust

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: rustup toolchain install stable --profile minimal
            - uses: Swatinem/rust-cache@v2
            - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
            - id: solc-versions
              run: |
                  python3 - <<'EOF'
                  import hashlib, json, pathlib
                  versions = sorted({
                      json.loads(p.read_text()).get("version", "")
                      for p in pathlib.Path("fixtures").glob("solc-*/*.json")
                      if p.name != "compilers.json"
                  })
                  print(f"hash={hashlib.sha256('\n'.join(versions).encode()).hexdigest()}")
                  EOF
            - uses: actions/cache@v4
              with:
                  path: .solc
                  key: solc-${{ runner.os }}-${{ steps.solc-versions.outputs.hash }}
                  restore-keys: |
                      solc-${{ runner.os }}-
            - run: make fixtures
            - run: make lint
            - run: make test
